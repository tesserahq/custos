name: Dependabot auto-merge

on:
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' || (startsWith(github.ref, 'refs/heads/') && github.ref != format('refs/heads/{0}', github.event.repository.default_branch)) }}

jobs:
  auto-merge:
    permissions:
      contents: write
      pull-requests: write
    uses: tesserahq/.github/.github/workflows/dependabot-auto-merge.yml@ba740570dec2210c2aac349663344075102bba2b # reviewed central workflow
