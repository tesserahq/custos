# Role definitions for Custos authorization system
# This file defines the permissions for each role type

roles:
  custos_admin:
    name: "Custos Admin"
    identifier: "custos-admin"
    description: "RBAC admin role with full permissions to manage roles and permissions"
    permissions:
      role:
        - read
        - update
        - delete
        - create
        - assign
      bindings:
        - read
        - update
        - delete
        - create
      memberships:
        - read
        - delete
        - create
      permission:
        - read
        - update
        - delete
        - create
  identies_admin:
    name: "Identies Admin"
    identifier: "identies-admin"
    description: "Identies admin role with full permissions to manage Service accounts and more"
    permissions:
      service_account:
        - read
        - update
        - delete
        - create
      api_key:
        - read
        - update
        - delete
        - create
