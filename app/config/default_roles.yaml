# Role definitions for Custos authorization system
# This file defines the permissions for each role type

roles:
  custos_admin:
    name: "Custos Admin"
    identifier: "custos_admin"
    description: "RBAC admin role with full permissions to manage roles and permissions"
    permissions:
      role:
        - read
        - update
        - delete
        - create
      permission:
        - read
        - update
        - delete
        - create
  identies_admin:
    name: "Identies Admin"
    identifier: "identies_admin"
    description: "Identies admin role with full permissions to manage System accounts and more"
    permissions:
      system_account:
        - read
        - update
        - delete
        - create
