# Role definitions for Custos authorization system
# This file defines the permissions for each role type

roles:
  custos_admin:
    name: "Custos Admin"
    identifier: "custos-admin"
    description: "RBAC admin role with full permissions to manage roles and permissions"
    permissions:
      role:
        - read
        - update
        - delete
        - create
        - assign
      binding:
        - read
        - update
        - delete
        - create
      membership:
        - read
        - delete
        - create
      permission:
        - read
        - update
        - delete
        - create
  identies_admin:
    name: "Identies Admin"
    identifier: "identies-admin"
    description: "Identies admin role with full permissions to manage Service accounts and more"
    permissions:
      service_account:
        - read
        - update
        - delete
        - create
      api_key:
        - read
        - update
        - delete
        - create
  orcha_admin:
    name: "Orcha Admin"
    identifier: "orcha-admin"
    description: "Orcha admin role with full permissions to manage Orcha and more"
    permissions:
      event_type:
        - read
        - create
      event:
        - read
        - delete
      category:
        - read
      source:
        - read
        - create
        - delete
        - update
      settings:
        - read
      user:
        - read
      workflow:
        - read
        - update
        - delete
        - create