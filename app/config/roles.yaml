# Role definitions for Custos authorization system
# This file defines the permissions for each role type

roles:
  admin:
    description: "Full system access within the domain"
    permissions:
      users:
        - read
        - write
        - delete
        - create
      projects:
        - read
        - write
        - delete
        - create
      documents:
        - read
        - write
        - delete
        - create
      roles:
        - read
        - write
        - delete
        - create
      settings:
        - read
        - write

  editor:
    description: "Content creation and editing permissions"
    permissions:
      users:
        - read
      projects:
        - read
        - write
        - create
      documents:
        - read
        - write
        - create
      settings:
        - read

  viewer:
    description: "Read-only access to all resources"
    permissions:
      users:
        - read
      projects:
        - read
      documents:
        - read
      settings:
        - read

  moderator:
    description: "Content moderation with limited user management"
    permissions:
      users:
        - read
        - write
      comments:
        - read
        - write
        - delete
      documents:
        - read
        - write

# Resource definitions for reference
resources:
  - users
  - projects
  - documents
  - roles
  - settings
  - comments

# Action definitions for reference
actions:
  - read
  - write
  - delete
  - create 