[project]
name = "custos"
version = "0.1.0"
description = ""
authors = [
    {name = "Emiliano Jankowski",email = "ejankowski@gmail.com"}
]
packages = [
    { include = "app" }
]
readme = "README.md"
requires-python = ">=3.11"

[tool.poetry.scripts]
dev = "run:dev"

[tool.poetry]
packages = [
    { include = "app" }
]

[tool.poetry.dependencies]
python = ">=3.14,<3.15"
fastapi = "^v0.141.1"
python-dotenv = "^1.2.3"
gunicorn = "26.2.0"
faker = "40.39.0"
sqlalchemy = "^2.0.39"
sqlalchemy-json = "^0.7.0"
asyncpg = "^0.31.0"
psycopg2-binary = "^2.9.10"
alembic = "^1.18.1"

pydantic = {extras = ["email"], version = "^2.11.3"}
black = "^26.0.0"
ruff = "0.16.7"
pydantic-settings = "^2.9.1"
python-jose = "^3.3.0"

opentelemetry-instrumentation-fastapi = "^0.64b0"
opentelemetry-exporter-otlp-proto-grpc = "^1.39.1"
opentelemetry-sdk = "^1.39.1"
opentelemetry-instrumentation-sqlalchemy = "^0.64b0"
opentelemetry-instrumentation-logging = "^0.64b0"
opentelemetry-instrumentation-requests = "^0.64b0"
prometheus-client = ">=0.24.1"
prometheus-fastapi-instrumentator = "^8.0.2"

pyjwt = "^2.10.1"
rollbar = "^1.4.0"
pycasbin = "^2.6.1"
casbin-sqlalchemy-adapter = "^1.4.0"
PyYAML = "^6.0.1"
# tessera-sdk = { path = "../tessera-sdk-py/", develop = true }
tessera-sdk = { git = "https://github.com/tesserahq/tessera-sdk-py.git", branch = "main" }
fastapi-pagination = "^0.15.16"
uvicorn = "0.52.4"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.0"
httpx = "^0.28.0"  # Required by FastAPI TestClient
pytest-asyncio = "^1.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
